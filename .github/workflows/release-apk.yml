name: Публикация версии

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Проверка принадлежности версии ветке main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - name: Тесты, Lint и сборка APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Подготовка файлов релиза
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "Nova-home-Launcher-$GITHUB_REF_NAME.apk"
          sha256sum "Nova-home-Launcher-$GITHUB_REF_NAME.apk" > "Nova-home-Launcher-$GITHUB_REF_NAME.apk.sha256"
      - name: Публикация GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Nova-home-Launcher-$GITHUB_REF_NAME.apk" \
            "Nova-home-Launcher-$GITHUB_REF_NAME.apk.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Nova home Launcher ${GITHUB_REF_NAME#v}"
