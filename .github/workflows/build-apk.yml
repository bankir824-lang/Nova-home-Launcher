name: Сборка APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - name: Сборка APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NovaTV-Launcher-v0.6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Отчёты и изображения UI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NovaTV-v0.6-checks
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
